- abs: "Interactive sensors are an important component of robotic systems but often require manual replacement due to wear and tear. This paper presents an autonomous sensor exchange and calibration system for an agricultural crop monitoring robot that inserts a nitrate sensor into cornstalks. A novel gripper and replacement mechanism with a funneling design enable efficient and reliable sensor exchanges. An on-board calibration station provides in-field sensor cleaning and calibration for consistent nitrate readings, and the system was deployed in a real cornfield where it successfully inserted nitrate sensors with a high measured success rate. The integration of exchange and calibration mechanisms enhances autonomy for long-term robot operation in agricultural environments."  
  authors: Janice Seungyeon Lee and Thomas Detlefsen and Shara Lawande and Saudamini Ghatge and Shrudhi Ramesh Shanthi and Sruthi Mukkamala and George Kantor and Oliver Kroemer  
