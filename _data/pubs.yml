- abs: "Model-based planners and controllers can efficiently optimize diverse objectives and generalize to long-horizon manipulation tasks, but they often fail due to model inaccuracies or unexpected disturbances. This paper introduces RecoveryChaining, a hierarchical reinforcement learning framework that learns local recovery policies triggered when a failure is detected based on sensory observations. The recovery policy uses a hybrid action space combining primitive robot actions with nominal options drawn from existing model-based controllers, enabling the system to determine how to recover, when to switch back to a nominal controller, and which controller to choose — even under sparse rewards. RecoveryChaining is evaluated on several multi-step manipulation tasks with sparse rewards, showing significantly more robust recovery policies than baseline methods, and the learned policies successfully transfer from simulation to a physical robot."
  authors: Shivam Vats and Devesh K. Jha and Maxim Likhachev and Oliver Kroemer and Diego Romeres
