- abs: "In cluttered environments where visual sensors encounter heavy occlusion, such as in agricultural settings, tactile signals can provide crucial spatial information for the robot to locate rigid objects and maneuver around them. This paper introduces SonicBoom, a holistic hardware and learning pipeline that enables contact localization through an array of contact microphones mounted on the robot’s end effector. Unlike traditional sound source localization methods that triangulate sources in air, localization through solid media with irregular geometry presents challenges that are difficult to model analytically. The approach uses feature engineering and learning-based mapping between acoustic signals and collision locations, collecting thousands of interaction sound pairs to train the model. By leveraging relative features between microphones, SonicBoom achieves localization errors of ~0.43 cm in distribution and remains robust (~2.22 cm error) with novel objects and contact conditions. The system's practical utility is demonstrated through haptic mapping in visually occluded environments, showing that acoustic-based sensing can enable reliable robot navigation and interaction."
