- abs: "Dexterous robotic manipulation in unstructured environments can greatly benefit from hand designs that are both highly dexterous and easy to manufacture and control. This paper presents DELTAHANDS, a synergistic dexterous hand framework built using soft delta robots that are modular, reconfigurable, and cost-effective. By leveraging delta robot kinematics and actuation synergies, the framework reduces control complexity while preserving dexterity. We characterize the delta robots’ kinematics, force profiles, and workspace, and validate the design through simulation and real-world grasping and teleoperation tasks that include cloth folding, cap opening, and object arrangement. The open-source framework supports easy hand reconfiguration for various manipulation tasks."
