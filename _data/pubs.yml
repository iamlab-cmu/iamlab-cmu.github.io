- abs: "Transferring skills between different objects remains one of the core challenges of open-world robot manipulation. Generalization needs to take into account the high-level structural differences between distinct objects while still maintaining similar low-level interaction control. In this work, we propose an example-based zero-shot approach to skill transfer that decomposes skills into a prioritized set of grounded task-axis controllers (GTACs). Each GTAC defines an adaptable controller, such as a position or force controller, along an axis that is semantically grounded to object keypoints and axes. Zero-shot transfer is achieved by identifying semantically similar grounding features on novel target objects using visual foundation models such as SD-DINO. We validate our approach through real robot experiments including screwing, pouring, and spatula scraping tasks, demonstrating robust controller transfer across diverse object geometries without requiring task-specific training or demonstrations."  
  authors: M. Yunus Seker and Shobhit Aggarwal and Oliver Kroemer  
  award: null  
  bib: >  
    @inproceedings{seker2025groundedtaskaxes,  
      title={Grounded Task Axes: Zero-Shot Semantic Skill Generalization Via Task-Axis Controllers and Visual Foundation Models},  
      author={Seker, M. Yunus and Aggarwal, Shobhit and Kroemer, Oliver},  
      booktitle={IEEE-RAS International Conference on Humanoid Robots (Humanoids)},  
      year={2025},  
      pages={791--798}  
    }  
