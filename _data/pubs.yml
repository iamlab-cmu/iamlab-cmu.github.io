- abs: "Embodied Question Answering (EQA) tasks require an agent to navigate and understand an unseen 3D environment in order to answer natural-language questions about that environment. This paper proposes GraphEQA, a method that builds and maintains real-time 3D metric-semantic scene graphs (3DSGs) as a compact, multimodal memory combining geometry and semantics for efficient exploration and planning. GraphEQA leverages task-relevant images and the hierarchical structure of 3DSGs to guide exploration and ground Vision-Language Models (VLMs) for real-time question answering. Evaluation in simulated environments shows that the approach improves semantic understanding and task performance for embodied reasoning compared to existing baselines."
