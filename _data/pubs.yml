- abs: "Collaborative robots must continually adapt to novel tasks and user preferences without overburdening human collaborators. Prior interactive robot learning methods typically focus on single-task scenarios and fall short in sustained, multi-task collaboration. This paper proposes COIL (Cost-Optimal Interactive Learning), a multi-task interaction planner that minimizes human effort across a sequence of tasks by strategically selecting among three query types: skill queries, preference queries, and help queries. When user preferences are known, the COIL optimization reduces to an uncapacitated facility location (UFL) problem, enabling bounded-suboptimal planning in polynomial time using established approximation algorithms. The formulation is extended to handle uncertainty in user preferences via a one-step belief space planner that incorporates the same efficient approximation routines. Simulated and real robot experiments on manipulation tasks demonstrate that the approach significantly reduces human work while maintaining task success."
  authors: Shivam Vats and Michelle Zhao and Patrick Callaghan and Mingxi Jia and Maxim Likhachev and Oliver Kroemer and George Konidaris
