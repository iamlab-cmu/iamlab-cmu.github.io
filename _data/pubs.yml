- abs: "Robots in complex real-world environments must perceive and navigate to goals without collisions, a challenge especially difficult in cluttered scenes with only raw sensory perception. Traditional diffusion policies and other generative models excel at local planning but struggle to enforce all constraints needed for global motion planning. This work introduces cascaded diffusion models that hierarchically unify global prediction and local refinement with online plan repair to generate full, collision-free trajectories. By combining high-level diffusion for overall path structure with lower-level refinement models, the approach produces trajectories that outperform a wide range of baselines across navigation and manipulation tasks."
