- abs: "Planning robot dexterity is challenging due to the non-smoothness introduced by contacts, intricate fine motions, and continuously changing task scenarios. This paper introduces HiDex, a hierarchical planning framework for dexterous robotic manipulation that actively explores both in-hand and extrinsic contacts. HiDex uses a three-level Monte-Carlo Tree Search (MCTS) structure: planning object motion and environmental contact modes, planning robot contact sequences, and path evaluation with control optimization. By efficiently reasoning over the high-dimensional contact spaces and facilitating incorporation of expert heuristics, the framework can solve diverse manipulation tasks requiring both intrinsic and extrinsic dexterity in seconds. Experiments on multiple hand configurations and environments demonstrate the approach’s flexibility and effectiveness for general manipulation planning."
  authors: Xianyi Cheng and Sarvesh Patil and Zeynep Temel and Oliver Kroemer and Matthew T. Mason
