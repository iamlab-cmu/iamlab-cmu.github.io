- abs: "Contact-rich manipulation tasks in agriculture, such as pruning and harvesting, require robots to physically interact with tree structures and distinguish between rigid and soft contacts despite heavy occlusions and limited visual viewpoints. This paper proposes a multi-modal classification framework that fuses vibrotactile (audio) and visual sensory inputs to identify contact types—leaf, twig, trunk, or ambient—by leveraging the unique vibration signals produced upon contact alongside complementary visual features. The system is trained using data collected with a hand-held sensor probe and demonstrates zero-shot generalization to a robot-mounted probe embodiment, achieving strong multi-class classification performance. These results underscore the potential of audio-visual learning to improve semantic contact classification for robust manipulation in unstructured agricultural environments."  
  authors: Ryan Spears and Moonyoung Lee and George Kantor and Oliver Kroemer  
